server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # TARGET & REWRITE LOGIC:
        # NOTE: If your backend is in another container, use the service name (e.g., http://backend:8000)
        # If using host networking or standard bridge, use the appropriate internal IP.
        # For this example, we assume 'host.docker.internal' or a service named 'backend'.
        proxy_pass http://valace_opac_api_web:80/api/v1/;

        # HEADERS (From your Vite Config):
        proxy_set_header Origin "http://valace_opac_api_web:80";
        proxy_set_header Referer "https://localhost:3001/";
        proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64)";
        proxy_set_header Accept "application/json, text/plain, */*";

        # STANDARD HEADERS:
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /cover {
        # COCE SERVER PROXY:
        # This proxies cover image requests to the book cover service
        proxy_pass http://valace_opac_coce_server:8081;

        # HEADERS:
        proxy_set_header Origin "http://valace_opac_coce_server:8081";
        proxy_set_header Referer "https://localhost:3001/";
        proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64)";
        proxy_set_header Accept "application/json, text/plain, */*";

        # STANDARD HEADERS:
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
